name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint + pytest (no training)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.11+ only: requirements pin scikit-learn==1.8.0 (matches the saved
        # reranker pickle's training version), and 1.8.0 requires Python >=3.11.
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies (public PyPI only)
        run: |
          python -m pip install --index-url https://pypi.org/simple/ --upgrade pip
          pip install --index-url https://pypi.org/simple/ -r requirements.txt
      - name: Ruff lint
        run: ruff check src scripts
      - name: Run pytest in mock-inference mode
        env:
          ENABLE_MOCK_INFERENCE: "true"
          MODEL_DIR: models/__ci_nonexistent__
        run: pytest -q
